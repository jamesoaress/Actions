name: Atualizar Changelog no README

on:
  push:
    branches:
      - main # Executa a ação sempre que houver um push na branch main

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para o Action poder fazer commits de volta

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Essencial: transfere todo o histórico de commits e não apenas o último

      - name: Gerar o histórico de commits
        run: |
          # Cria o cabeçalho da tabela
          echo "| Data | Atualização | Hash | Autor |" > new_changelog.txt
          echo "|:---|:---|:---:|:---|" >> new_changelog.txt
          # Preenche a tabela com os dados formatados
          git log --date=short --pretty=format:"| **%ad** | %s | \`%h\` |  *%an* |" >> new_changelog.txt

      - name: Inserir o Changelog no README.md
        run: |
          # Utiliza o awk para substituir o texto entre as tags START e END no README pelo novo histórico
          awk '/<!-- CHANGELOG:START -->/{print; system("cat new_changelog.txt"); print ""; f=1; next} /<!-- CHANGELOG:END -->/{f=0} !f' README.md > temp.md
          mv temp.md README.md

      - name: Fazer commit e push do novo README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: atualizar changelog no README"
          file_pattern: 'README.md'
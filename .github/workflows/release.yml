name: Gerar Release Automática

on:
  push:
    branches:
      - main # O workflow será ativado a cada novo commit/push na branch main

jobs:
  criar-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão obrigatória para o bot conseguir criar a release no GitHub

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Empacotar o projeto em ZIP
        run: zip -r pacote-projeto.zip . -x "*.git*" ".github/*"
        # Compacta todos os arquivos, excluindo pastas ocultas do git e os próprios workflows

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }} # Usa o número da execução para gerar uma tag única (ex: v1.0.1, v1.0.2)
          name: Release Automática v1.0.${{ github.run_number }}
          body: "Release gerada automaticamente a partir do novo commit."
          files: pacote-projeto.zip # Anexa o ZIP que foi exigido no trabalho
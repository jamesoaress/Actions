name: Criar Release Automática

on:
  push:
    tags:
      - 'v*' # Executa a ação sempre que enviar uma tag que comece por "v" (ex: v1.0.0)

jobs:
  publicar-versao:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão obrigatória para que o Action possa criar e publicar a Release

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Se o seu projeto precisar de ser compilado ou empacotado antes do lançamento
      # (ex: gerar ficheiros .zip, construir uma imagem, etc.), adicionaria esses passos aqui.

      - name: Gerar e Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # Gera automaticamente um resumo das alterações com base nos seus commits recentes